{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - Énergie</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="min-h-screen bg-slate-100
           flex items-center justify-center p-4"
>


<div class="w-full max-w-md">


    <div
        class="bg-white rounded-2xl shadow-xl
               p-8"
    >

        <div class="text-center mb-8">

            <div
                class="w-16 h-16 mx-auto
                       bg-blue-600 text-white
                       rounded-2xl
                       flex items-center justify-center
                       text-3xl"
            >
                ⚡
            </div>

            <h1
                class="text-2xl font-bold mt-4"
            >
                Gestion Électricité
            </h1>

            <p class="text-slate-500 mt-2">
                Connectez-vous à votre espace
            </p>

        </div>


        {% if erreur %}

            <div
                class="bg-red-50 border border-red-200
                       text-red-700 rounded-lg
                       p-3 mb-5"
            >
                {{ erreur }}
            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-4">

                <label
                    class="block text-sm font-medium mb-2"
                >
                    Nom d'utilisateur
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    class="w-full border border-slate-300
                           rounded-lg px-4 py-3
                           focus:ring-2 focus:ring-blue-500
                           outline-none"
                >

            </div>


            <div class="mb-6">

                <label
                    class="block text-sm font-medium mb-2"
                >
                    Mot de passe
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    class="w-full border border-slate-300
                           rounded-lg px-4 py-3
                           focus:ring-2 focus:ring-blue-500
                           outline-none"
                >

            </div>


            <button
                type="submit"
                class="w-full bg-blue-600
                       hover:bg-blue-700
                       text-white font-semibold
                       py-3 rounded-lg"
            >
                Se connecter
            </button>

        </form>

    </div>


    <p class="text-center text-sm text-slate-500 mt-6">
        Système de gestion des compteurs électriques
    </p>


</div>


</body>

</html>
